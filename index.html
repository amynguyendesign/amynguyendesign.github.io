			* { box-sizing: border-box; }

			#root { min-height: 100vh; min-height: 100dvh; }
			.ps { -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding-bottom: env(safe-area-inset-bottom); }
			@media (hover: none) and (pointer: coarse) { .an-root { cursor: default !important; } }
			.ps::-webkit-scrollbar { width: 5px; }
			.ps::-webkit-scrollbar-track { background: transparent; }

			@keyframes blkFloatB { 0%,100%{transform:translateY(0) rotate(0deg);} 50%{transform:translateY(-18px) rotate(40deg);} }
			@keyframes blkFloatC { 0%,100%{transform:rotate(8deg) translateY(0);} 50%{transform:rotate(-6deg) translateY(12px);} }
			@keyframes blkFloatD { 0%,100%{transform:rotate(-4deg) translateX(0);} 50%{transform:rotate(6deg) translateX(14px);} }
			.an-art-grid { grid-template-columns: repeat(3, 1fr); }
			@media (max-width: 600px) {

	<body>
		<div id="root"></div>
		<script type="text/babel">

const { useState, useRef, useEffect, useCallback } = React;

const WHITE = "#FFFFFF";
const BLACK = "#0A0A0A";
const PASTELS = ["#F2D7D9", "#D3CEDF", "#9CB4CC", "#748DA6"];
const NAV_COLOR = "#D3CEDF";
const DISP = '"Space Grotesk", "Helvetica Neue", Arial, sans-serif';
const NAME = "amy nguyen";
const SPRING = 0.06, DAMPING = 0.8, REPEL_RADIUS = 150, REPEL_FORCE = 2000;
const IS_TOUCH = (typeof window !== 'undefined') && window.matchMedia && window.matchMedia('(hover: none) and (pointer: coarse)').matches;

const ART_IMAGES = [
	{ src: "src/assets/graphite.jpg", title: "Graphite Study", medium: "Graphite", alt: "Graphite" },
	{ src: "src/assets/onions.JPG", title: "Onions", medium: "Watercolor", alt: "Onions" },
	{ src: "src/assets/cactus.jpg", title: "Cactus", medium: "Watercolor", alt: "Cactus" },
	{ src: "src/assets/sf.jpg", title: "San Francisco", medium: "Watercolor", alt: "SF" },
	{ src: "src/assets/chocolate.JPG", title: "Chocolate", medium: "Oil", alt: "Chocolate" },
	{ src: "src/assets/spatula.JPG", title: "Spatula", medium: "Watercolor", alt: "Spatula" },
	{ src: "src/assets/bird.jpg", title: "Bird", medium: "Watercolor", alt: "Bird" },
	{ src: "src/assets/metal.jpg", title: "Metal", medium: "Acrylic", alt: "Metal" },
	{ src: "src/assets/coffee.jpg", title: "Coffee", medium: "Watercolor", alt: "Coffee" },
	{ src: "src/assets/surreal.jpg", title: "Surreal", medium: "Oil", alt: "Surreal" },
	{ src: "src/assets/toast.jpg", title: "Toast", medium: "Watercolor", alt: "Toast" },
];

const NAV_ITEMS = ["home", "about", "studio", "contact"];
const VALID_SECTIONS = ["home", "about", "art", "studio", "contact"];

function track(name, params) {
	if (typeof gtag === "function") gtag("event", name, params || {});
}

function App() {
	const containerRef = useRef(null);
	const mouseRef = useRef({ x: -999, y: -999 });
	const lettersRef = useRef([]);
	const particlesRef = useRef([]);
	const frameRef = useRef(null);
	const startRef = useRef(performance.now());
	const [, tickR] = useState(0);

	const initTab = (new URLSearchParams(window.location.search).get("tab") || "home").toLowerCase();
	const [section, setSection] = useState(VALID_SECTIONS.indexOf(initTab) >= 0 ? initTab : "home");
	const [navHover, setNavHover] = useState(null);
	const [hoveredArt, setHoveredArt] = useState(null);
	const [lightbox, setLightbox] = useState(null);
	const [hoveredStudio, setHoveredStudio] = useState(null);
	const [aboutHover, setAboutHover] = useState(false);

	useEffect(() => {
		lettersRef.current = NAME.split("").map((char, i) => ({
			char, homeX: 0, homeY: 0, x: 0, y: 0, vx: 0, vy: 0, rotation: 0, vr: 0, scale: 1, speed: 0, phase: i * 0.55,
		}));
		track("page_view", { page_title: initTab, page_location: "/" + initTab });
	}, []);

	// Periodic gust — a gentle wave travels through the letters
	useEffect(() => {
		let timers = [];
		const wave = () => {
			lettersRef.current.forEach((L, i) => {
				const tt = setTimeout(() => {
					if (L.char === " ") return;
					L.vy -= 7.5;
					L.vr += (i % 2 ? 1 : -1) * 2.2;
				}, i * 65);
				timers.push(tt);
			});
		};
		const first = setTimeout(wave, 2200);
		const iv = setInterval(wave, 6000);
		return () => { clearTimeout(first); clearInterval(iv); timers.forEach(clearTimeout); };
	}, []);


	const goTo = (id) => {
		setSection(id);
		try {
			const u = new URL(window.location.href);
			if (id === "home") u.searchParams.delete("tab"); else u.searchParams.set("tab", id);
			window.history.replaceState({}, "", u);
		} catch (e) {}
		track("tab_click", { tab_name: id });
		track("page_view", { page_title: id, page_location: "/" + id });
	};

	const computeHomes = useCallback(() => {
		if (!containerRef.current) return;
		const els = containerRef.current.querySelectorAll(".k-letter");
		const cr = containerRef.current.getBoundingClientRect();
		els.forEach((el, i) => {
			const L = lettersRef.current[i]; if (!L) return;
			const r = el.getBoundingClientRect();
			L.homeX = r.left - cr.left + r.width / 2;
			L.homeY = r.top - cr.top + r.height / 2;
			if (L.x === 0 && L.y === 0) {
				L.x = L.homeX + (Math.random() - 0.5) * 500;
				L.y = L.homeY - 100 - Math.random() * 200;
				L.rotation = (Math.random() - 0.5) * 90;
			}
		});
	}, []);

	useEffect(() => {
		computeHomes();
		let last = performance.now();
		const loop = (now) => {
			const dt = Math.min((now - last) / 16, 3); last = now;
			const t = (now - startRef.current) / 1000;
			const mx = mouseRef.current.x, my = mouseRef.current.y;
			lettersRef.current.forEach((L) => {
				if (L.char === " ") return;
				const idleX = Math.sin(t * 0.9 + L.phase) * 2.6;
				const idleY = Math.sin(t * 1.25 + L.phase) * 6.0;
				const idleRot = Math.sin(t * 0.7 + L.phase) * 2.4;
				const tx = L.homeX + idleX, ty = L.homeY + idleY;
				let ax = (tx - L.x) * SPRING, ay = (ty - L.y) * SPRING;
				const mdx = L.x - mx, mdy = L.y - my, md = Math.sqrt(mdx * mdx + mdy * mdy);
				if (md < REPEL_RADIUS && md > 1) {
					const f = (1 - md / REPEL_RADIUS) * (1 - md / REPEL_RADIUS) * REPEL_FORCE;
					ax += (mdx / md) * f * 0.008; ay += (mdy / md) * f * 0.008;
					L.vr += (mdx > 0 ? 1 : -1) * f * 0.00014;
				}
				L.vx = (L.vx + ax * dt) * DAMPING; L.vy = (L.vy + ay * dt) * DAMPING;
				L.x += L.vx * dt; L.y += L.vy * dt;
				L.vr += (idleRot - L.rotation) * 0.05 * dt; L.vr *= 0.86; L.rotation += L.vr * dt;
				L.speed = Math.sqrt(L.vx * L.vx + L.vy * L.vy);
				L.scale = 1 + Math.min(L.speed * 0.006, 0.35);
			});
			particlesRef.current = particlesRef.current.filter((p) => {
				p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 0.2 * dt;
				p.life -= 0.025 * dt; p.vx *= 0.98; return p.life > 0;
			});
			tickR((n) => n + 1);
			frameRef.current = requestAnimationFrame(loop);
		};
		frameRef.current = requestAnimationFrame(loop);
		return () => cancelAnimationFrame(frameRef.current);
	}, [computeHomes]);

	useEffect(() => {
		const r = () => setTimeout(computeHomes, 50);
		window.addEventListener("resize", r);
		return () => window.removeEventListener("resize", r);
	}, [computeHomes]);

	const onMove = (e) => {
		if (!containerRef.current) return;
		const r = containerRef.current.getBoundingClientRect();
		mouseRef.current = { x: e.clientX - r.left, y: e.clientY - r.top };
	};
	const onClick = (e) => {
		if (["BUTTON", "A", "IMG"].indexOf(e.target.tagName) >= 0) return;
		if (!containerRef.current) return;
		const r = containerRef.current.getBoundingClientRect();
		const cx = e.clientX - r.left, cy = e.clientY - r.top;
		lettersRef.current.forEach((L) => {
			if (L.char === " ") return;
			const dx = L.x - cx, dy = L.y - cy, d = Math.max(Math.sqrt(dx * dx + dy * dy), 30);
			const f = 580 / d;
			L.vx += (dx / d) * f; L.vy += (dy / d) * f; L.vr += (Math.random() - 0.5) * 14;
		});
		const PARTS = IS_TOUCH ? 12 : 20;
		for (let i = 0; i < PARTS; i++) {
			const a = (Math.PI * 2 * i) / PARTS, s = 3 + Math.random() * 7;
			particlesRef.current.push({
				x: cx, y: cy, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 3,
				life: 0.5 + Math.random() * 0.5, size: 5 + Math.random() * 8,
				color: PASTELS[Math.floor(Math.random() * PASTELS.length)], square: Math.random() > 0.5,
			});
		}
	};

	const craftHL = { background: PASTELS[3], color: WHITE, padding: "2px 8px", borderRadius: 4, fontWeight: 700, letterSpacing: "0.01em" };

	return (
		<div ref={containerRef} onMouseMove={onMove} onClick={onClick}
			onMouseLeave={() => { mouseRef.current = { x: -999, y: -999 }; }}
			className="an-root"
			style={{ width: "100%", minHeight: "100vh", height: "100dvh", background: WHITE, position: "relative", overflow: "hidden", cursor: "crosshair", userSelect: "none", display: "flex", flexDirection: "column", fontFamily: DISP }}>

			{particlesRef.current.map((p, i) => (
				<div key={i} style={{ position: "absolute", left: p.x, top: p.y, width: p.size, height: p.size, borderRadius: p.square ? 2 : "50%", background: p.color, opacity: p.life, transform: "translate(-50%,-50%)", pointerEvents: "none", zIndex: 30 }} />
			))}

			{lightbox && (
				<div onClick={() => setLightbox(null)} style={{ position: "fixed", inset: 0, zIndex: 100, background: "rgba(255,255,255,0.92)", backdropFilter: "blur(4px)", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", animation: "fadeIn 0.2s", padding: 24 }}>
					<div style={{ position: "relative" }} onClick={(e) => e.stopPropagation()}>
						<div onClick={() => setLightbox(null)} style={{ position: "absolute", top: -14, right: -14, width: 30, height: 30, borderRadius: "50%", background: WHITE, border: "2px solid " + BLACK, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", fontFamily: DISP, fontSize: 14, fontWeight: 700, color: BLACK, zIndex: 101 }}>&times;</div>
						<img src={lightbox} alt="" style={{ maxWidth: "82vw", maxHeight: "82vh", objectFit: "contain", borderRadius: 4, border: "3px solid " + BLACK, display: "block" }} />
					</div>
				</div>
			)}

			<nav className="an-nav" style={{ display: "flex", justifyContent: "center", flexWrap: "wrap", gap: 6, padding: "calc(16px + env(safe-area-inset-top)) 16px 12px", zIndex: 20, flexShrink: 0 }}>
				{NAV_ITEMS.map((id) => {
					const active = section === id || (id === "studio" && section === "art");
					const hov = navHover === id;
					return (
						<button key={id} onClick={(e) => { e.stopPropagation(); goTo(id); }}
							onMouseEnter={() => setNavHover(id)} onMouseLeave={() => setNavHover(null)}
							style={{ fontFamily: DISP, fontSize: 13, fontWeight: 700, letterSpacing: "0.02em", cursor: "pointer", padding: "8px 18px", borderRadius: 8, border: "none", color: BLACK, background: active ? NAV_COLOR : (hov ? NAV_COLOR + "66" : "transparent"), transform: hov && !active ? "translateY(-2px)" : "none", transition: "all 0.2s cubic-bezier(0.34,1.56,0.64,1)" }}>
							{id}
						</button>
					);
				})}
			</nav>

			<div style={{ flex: 1, position: "relative", overflow: "hidden" }}>
				{/* HOME */}
				{section === "home" && (
					<div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", pointerEvents: "none" }}>
						<div style={{ position: "absolute", top: "18%", left: "9%", width: 46, height: 46, background: PASTELS[0], borderRadius: 7, animation: "blkFloatA 7s ease-in-out infinite, fadeIn 1s ease 0.3s both" }} />
						<div style={{ position: "absolute", bottom: "20%", right: "11%", width: 32, height: 32, background: PASTELS[2], borderRadius: "50%", animation: "blkFloatB 9s ease-in-out infinite, fadeIn 1s ease 0.6s both" }} />
						<div style={{ position: "absolute", top: "60%", left: "14%", width: 20, height: 58, background: PASTELS[1], borderRadius: 5, animation: "blkFloatC 8s ease-in-out infinite, fadeIn 1s ease 0.9s both" }} />
						<div style={{ position: "absolute", top: "24%", right: "16%", width: 60, height: 16, background: PASTELS[3], borderRadius: 4, animation: "blkFloatD 10s ease-in-out infinite, fadeIn 1s ease 1.2s both" }} />

						<div style={{ display: "flex", whiteSpace: "nowrap", marginBottom: 12, position: "relative", zIndex: 2 }}>
							{NAME.split("").map((char, i) => {
								const L = lettersRef.current[i];
								if (!L || char === " ") return <span key={i} className="k-letter" style={{ display: "inline-block", width: "clamp(14px,3.5vw,34px)", fontFamily: DISP, fontSize: "clamp(46px,11vw,104px)" }}>&nbsp;</span>;
								const ox = L.x - L.homeX, oy = L.y - L.homeY;
								return <span key={i} className="k-letter" style={{ display: "inline-block", fontFamily: DISP, fontWeight: 700, fontSize: "clamp(46px,11vw,104px)", color: BLACK, lineHeight: 1, transform: "translate(" + ox + "px," + oy + "px) rotate(" + L.rotation + "deg) scale(" + L.scale + ")", willChange: "transform", letterSpacing: "-0.03em" }}>{char}</span>;
							})}
						</div>
						<div style={{ fontFamily: DISP, fontSize: "clamp(13px,2vw,18px)", color: BLACK, fontWeight: 600, letterSpacing: "0.02em", zIndex: 2, animation: "fadeIn 0.8s ease 0.5s both", textAlign: "center", lineHeight: 1.5, padding: "0 20px" }}>
							Engineer. Designer.<br />Stanford-trained. SF-based.
						</div>
					</div>
				)}

				{/* ABOUT */}
				{section === "about" && (
					<div className="ps" style={{ position: "absolute", inset: 0, overflow: "auto" }}>
						<div className="an-section" style={{ maxWidth: 620, margin: "0 auto", padding: "20px 28px 32px", animation: "contentIn 0.35s ease" }}>
							<div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 16 }}>
								<div style={{ width: 6, height: 34, background: NAV_COLOR, borderRadius: 3 }} />
								<h2 style={{ fontFamily: DISP, fontSize: 34, fontWeight: 700, color: BLACK, margin: 0 }}>About me</h2>
							</div>
							<div className="an-about-row">
								<img className="an-about-photo" src="src/assets/amy.jpg" alt="Amy" onMouseEnter={() => setAboutHover(true)} onMouseLeave={() => setAboutHover(false)} onClick={(e) => { e.stopPropagation(); setLightbox("src/assets/amy.jpg"); track("about_photo_open", {}); }} style={{ width: 140, float: "right", position: "relative", zIndex: 3, marginLeft: 18, marginBottom: 10, cursor: "pointer", border: "2px solid " + (aboutHover ? PASTELS[2] : BLACK), borderRadius: 5, transform: aboutHover ? "translateY(-4px) rotate(-0.5deg)" : "rotate(1.5deg)", boxShadow: aboutHover ? "4px 4px 0 " + PASTELS[2] : "none", transition: "all 0.25s cubic-bezier(0.34,1.56,0.64,1)" }} />
								<div style={{ fontFamily: DISP, fontSize: 15, color: BLACK, lineHeight: "26px", opacity: 0.88, fontWeight: 500 }}>
									<p style={{ marginBottom: 12 }}>I entered Stanford with a background in writing and literature, but chose to pursue Computer Science because I wanted to push myself toward an intellectual challenge I hadn't yet mastered.</p>
									<p style={{ marginBottom: 12 }}>With no prior technical experience, I started from scratch: multivariable calculus, first-order logic, my first lines of code. Computer Science gave me a second language for thinking: decompose, debug, build.</p>
									<p style={{ marginBottom: 12 }}>Working between engineering and design, I take pride in my work and continually strive to refine my skills. Drawn to patterns, I have a gut feeling for how things align, when they work, and where they break.</p>
									<p style={{ marginBottom: 0 }}>The through line across my work and life is <span style={craftHL}>craft</span>. I bring the same curiosity and rigor to everything I touch. Understand how something is made. Go deep. Do honest work. Repeat.</p>
								</div>
							</div>
							<div style={{ clear: "both" }} />
						</div>
					</div>
				)}

				{/* ART */}
				{section === "art" && (
					<div className="ps" style={{ position: "absolute", inset: 0, overflow: "auto" }}>
						<div className="an-section" style={{ maxWidth: 640, margin: "0 auto", padding: "20px 28px 32px", animation: "contentIn 0.35s ease" }}>
							<div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 6 }}>
								<div style={{ width: 6, height: 34, background: NAV_COLOR, borderRadius: 3 }} />
								<h2 style={{ fontFamily: DISP, fontSize: 34, fontWeight: 700, color: BLACK, margin: 0 }}>Art</h2>
							</div>
							<p style={{ fontFamily: DISP, fontSize: 15, color: BLACK, opacity: 0.7, lineHeight: "23px", marginBottom: 18, marginLeft: 16, fontWeight: 500 }}>A collection of works and studies across oil, watercolor, acrylic, and graphite.</p>
							<div className="an-art-grid" style={{ display: "grid", gap: 10 }}>
								{ART_IMAGES.map((img, i) => {
									const hov = hoveredArt === i; const pc = PASTELS[i % PASTELS.length];
									return (
										<div key={i} onMouseEnter={() => setHoveredArt(i)} onMouseLeave={() => setHoveredArt(null)}
											onClick={(e) => { e.stopPropagation(); setLightbox(img.src); track("art_lightbox_open", { image: img.title, medium: img.medium }); }}
											style={{ background: WHITE, border: "2px solid " + (hov ? pc : BLACK), borderRadius: 5, overflow: "hidden", cursor: "pointer", transform: hov ? "translateY(-4px) rotate(-0.5deg)" : "none", boxShadow: hov ? "4px 4px 0 " + pc : "none", transition: "all 0.25s cubic-bezier(0.34,1.56,0.64,1)" }}>
											<div style={{ aspectRatio: "1", overflow: "hidden", borderBottom: "1.5px solid " + (hov ? pc : BLACK) }}>
												<img src={img.src} alt={img.alt} loading="lazy" style={{ width: "100%", height: "100%", objectFit: "cover", display: "block" }} />
											</div>
											<div style={{ padding: "6px 9px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
												<span style={{ fontFamily: DISP, fontSize: 11, color: BLACK, fontWeight: 600, opacity: 0.7 }}>{img.title}</span>
												<span style={{ fontFamily: DISP, fontSize: 10, color: BLACK, opacity: 0.4, fontWeight: 500 }}>{img.medium}</span>
											</div>
										</div>
									);
								})}
							</div>
						</div>
					</div>
				)}

				{/* STUDIO */}
				{section === "studio" && (
					<div className="ps" style={{ position: "absolute", inset: 0, overflow: "auto" }}>
						<div className="an-section" style={{ maxWidth: 560, margin: "0 auto", padding: "20px 28px 32px", animation: "contentIn 0.35s ease" }}>
							<div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 6 }}>
								<div style={{ width: 6, height: 34, background: NAV_COLOR, borderRadius: 3 }} />
								<h2 style={{ fontFamily: DISP, fontSize: 34, fontWeight: 700, color: BLACK, margin: 0 }}>Studio</h2>
							</div>
							<p style={{ fontFamily: DISP, fontSize: 14, color: BLACK, opacity: 0.5, fontStyle: "italic", marginBottom: 22, marginLeft: 16, fontWeight: 500 }}>I like making stuff</p>

							<button onClick={(e) => { e.stopPropagation(); track("studio_click", { project: "art" }); goTo("art"); }}
								onMouseEnter={() => setHoveredStudio("art")} onMouseLeave={() => setHoveredStudio(null)}
								style={{ width: "100%", textAlign: "left", display: "flex", alignItems: "center", padding: "15px 16px", borderRadius: 10, cursor: "pointer", marginBottom: 6, background: hoveredStudio === "art" ? PASTELS[2] + "33" : "transparent", border: "2px solid " + (hoveredStudio === "art" ? PASTELS[2] : BLACK + "15"), transform: hoveredStudio === "art" ? "translateX(6px)" : "none", transition: "all 0.2s cubic-bezier(0.34,1.56,0.64,1)" }}>
								<span style={{ width: 28, height: 28, borderRadius: 6, background: PASTELS[2], color: BLACK, fontFamily: DISP, fontSize: 11, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center", marginRight: 14, flexShrink: 0 }}>01</span>
								<span style={{ fontFamily: DISP, fontSize: 18, fontWeight: 700, color: BLACK }}>art</span>
								<span style={{ flex: 1, borderBottom: "1.5px dotted " + BLACK + "20", margin: "0 14px", marginBottom: -2 }} />
								<span style={{ fontFamily: DISP, fontSize: 12, color: BLACK, opacity: 0.55, fontWeight: 500 }}>occasional paintings</span>
								<span style={{ marginLeft: 10, color: BLACK, fontWeight: 700, fontSize: 18, opacity: hoveredStudio === "art" ? 0.6 : 0, transform: hoveredStudio === "art" ? "translateX(0)" : "translateX(-6px)", transition: "all 0.2s" }}>&rarr;</span>
							</button>

							<a href="/game" onClick={(e) => { e.stopPropagation(); track("studio_click", { project: "melange" }); }}
								onMouseEnter={() => setHoveredStudio("mel")} onMouseLeave={() => setHoveredStudio(null)}
								style={{ display: "flex", alignItems: "center", padding: "15px 16px", borderRadius: 10, cursor: "pointer", marginBottom: 6, textDecoration: "none", background: hoveredStudio === "mel" ? PASTELS[0] + "33" : "transparent", border: "2px solid " + (hoveredStudio === "mel" ? PASTELS[0] : BLACK + "15"), transform: hoveredStudio === "mel" ? "translateX(6px)" : "none", transition: "all 0.2s cubic-bezier(0.34,1.56,0.64,1)" }}>
								<span style={{ width: 28, height: 28, borderRadius: 6, background: PASTELS[0], color: BLACK, fontFamily: DISP, fontSize: 11, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center", marginRight: 14, flexShrink: 0 }}>02</span>
								<span style={{ fontFamily: DISP, fontSize: 18, fontWeight: 700, color: BLACK }}>m&eacute;lange</span>
								<span style={{ flex: 1, borderBottom: "1.5px dotted " + BLACK + "20", margin: "0 14px", marginBottom: -2 }} />
								<span style={{ fontFamily: DISP, fontSize: 12, color: BLACK, opacity: 0.55, fontWeight: 500 }}>color mixing game</span>
								<span style={{ marginLeft: 10, color: BLACK, fontWeight: 700, fontSize: 18, opacity: hoveredStudio === "mel" ? 0.6 : 0, transform: hoveredStudio === "mel" ? "translateX(0)" : "translateX(-6px)", transition: "all 0.2s" }}>&rarr;</span>
							</a>

							<a href="/phonetics" onClick={(e) => { e.stopPropagation(); track("studio_click", { project: "phonetics" }); }}
								onMouseEnter={() => setHoveredStudio("phon")} onMouseLeave={() => setHoveredStudio(null)}
								style={{ display: "flex", alignItems: "center", padding: "15px 16px", borderRadius: 10, cursor: "pointer", marginBottom: 6, textDecoration: "none", background: hoveredStudio === "phon" ? PASTELS[1] + "33" : "transparent", border: "2px solid " + (hoveredStudio === "phon" ? PASTELS[1] : BLACK + "15"), transform: hoveredStudio === "phon" ? "translateX(6px)" : "none", transition: "all 0.2s cubic-bezier(0.34,1.56,0.64,1)" }}>
								<span style={{ width: 28, height: 28, borderRadius: 6, background: PASTELS[1], color: BLACK, fontFamily: DISP, fontSize: 11, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center", marginRight: 14, flexShrink: 0 }}>03</span>
								<span style={{ fontFamily: DISP, fontSize: 18, fontWeight: 700, color: BLACK }}>phonetics review</span>
								<span style={{ flex: 1, borderBottom: "1.5px dotted " + BLACK + "20", margin: "0 14px", marginBottom: -2 }} />
								<span style={{ fontFamily: DISP, fontSize: 12, color: BLACK, opacity: 0.55, fontWeight: 500 }}>for language learning</span>
								<span style={{ marginLeft: 10, color: BLACK, fontWeight: 700, fontSize: 18, opacity: hoveredStudio === "phon" ? 0.6 : 0, transform: hoveredStudio === "phon" ? "translateX(0)" : "translateX(-6px)", transition: "all 0.2s" }}>&rarr;</span>
							</a>
						</div>
					</div>
				)}


				{/* CONTACT */}
				{section === "contact" && (
					<div className="ps" style={{ position: "absolute", inset: 0, overflow: "auto" }}>
						<div className="an-section" style={{ maxWidth: 560, margin: "0 auto", padding: "20px 28px 32px", animation: "contentIn 0.35s ease" }}>
							<div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 20 }}>
								<div style={{ width: 6, height: 34, background: NAV_COLOR, borderRadius: 3 }} />
								<h2 style={{ fontFamily: DISP, fontSize: 34, fontWeight: 700, color: BLACK, margin: 0 }}>Contact</h2>
							</div>
							<div style={{ fontFamily: DISP, fontSize: 15, color: BLACK, lineHeight: "26px", opacity: 0.88, fontWeight: 500 }}>
								<p style={{ marginBottom: 16 }}>If you want to discuss design, tech, culture &mdash; or debate whether Comic Sans is ever acceptable, <a href="https://www.linkedin.com/in/nguyen-amy" target="_blank" rel="noopener noreferrer" onClick={(e) => { e.stopPropagation(); track("outbound_click", { link_url: "linkedin" }); }} style={{ color: BLACK, fontWeight: 700, textDecoration: "none", background: PASTELS[2], padding: "2px 5px", borderRadius: 3 }}>message me on LinkedIn</a>.</p>
								<p style={{ marginBottom: 0 }}>You can also keep up with what I'm reading on <a href="https://goodreads.com/amynlha" target="_blank" rel="noopener noreferrer" onClick={(e) => { e.stopPropagation(); track("outbound_click", { link_url: "goodreads" }); }} style={{ color: BLACK, fontWeight: 700, textDecoration: "none", background: PASTELS[0], padding: "2px 5px", borderRadius: 3 }}>Goodreads</a>.</p>
							</div>
						</div>
					</div>
				)}
			</div>

			<div style={{ padding: "10px 24px calc(16px + env(safe-area-inset-bottom))", display: "flex", justifyContent: "center", flexShrink: 0, zIndex: 10 }}>
				<span style={{ fontFamily: DISP, fontSize: 11, color: BLACK, opacity: 0.5, letterSpacing: "0.08em", fontWeight: 500 }}>Amy Nguyen &copy; 2026</span>
			</div>
		</div>
	);
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

		</script>
	</body>
</html>
