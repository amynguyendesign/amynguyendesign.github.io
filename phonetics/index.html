  function pickVoice(pref) {
    const voices = window.speechSynthesis ? window.speechSynthesis.getVoices() || [] : [];
    const cands = voices.filter(v => v.lang && v.lang.toLowerCase().replace("_","-").startsWith(pref));
    if (!cands.length) return null;
    return cands.find(v => v.default) || cands[0];
  }
  function speak(text, lang) {
    if (!window.speechSynthesis || !text) return;
    const synth = window.speechSynthesis; synth.cancel();
    const fire = () => {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang || "en-US"; u.rate = 0.85;
      const v = pickVoice(lang ? lang.slice(0,2).toLowerCase() : "en");
      if (v) u.voice = v;
      synth.speak(u);
    };
    const voices = synth.getVoices() || [];
    if (voices.length) { setTimeout(fire, 50); return; }
    let done = false;
    const go = () => { if (done) return; done = true; fire(); };
    synth.addEventListener("voiceschanged", go, { once: true });
    setTimeout(go, 600);
  }

              <div style={{ padding: "12px 14px" }}>
                {/* IPA symbol — tappable */}
                <button onClick={() => speak(p.examples[0] || p.ipa, lang.speak)}
                  style={{ background: "none", border: "none", padding: 0, marginBottom: 6, display: "block" }}>
                  <span style={{ fontSize: 24, fontWeight: 700, color: BLACK }}>/{p.ipa}/</span>
                </button>
                {/* Spellings */}
                <div style={{ display: "flex", flexWrap: "wrap", gap: 4, marginBottom: 8 }}>
                  {p.spellings.map((s, j) => (
                    <span key={j} style={{ fontSize: 11, fontWeight: 600, background: lang.color + "30", color: BLACK, borderRadius: 4, padding: "2px 7px" }}>{s}</span>
                  ))}
                </div>
                {/* Example words — tappable */}
                <div style={{ display: "flex", flexWrap: "wrap", gap: "4px 12px" }}>
                  {p.examples.map((ex, j) => (
                    <button key={j} onClick={() => speak(ex, lang.speak)}
                      style={{ background: "none", border: "none", padding: 0, fontSize: 14, fontWeight: 600, color: BLACK }}>
                      {ex}
                    </button>
                  ))}
                </div>
              </div>
            </div>
          ))}
        </div>

        <div style={{ textAlign: "center", marginTop: 24, fontSize: 12, fontWeight: 500, color: BLACK, opacity: 0.35 }}>
          {lang.flag} {lang.data.length} phonemes &middot; amynguyen.studio
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
