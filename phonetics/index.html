  function pickVoice(pref){
    const voices = window.speechSynthesis ? window.speechSynthesis.getVoices()||[] : [];
    const cands = voices.filter(v=>v.lang && v.lang.toLowerCase().replace("_","-").startsWith(pref));
    if(!cands.length) return null;
    return cands.find(v=>v.default)||cands[0];
  }
  function speak(text, lang){
    if(!window.speechSynthesis || !text) return;
    const synth=window.speechSynthesis; synth.cancel();
    const fire=()=>{ const u=new SpeechSynthesisUtterance(text); u.lang=lang||"en-US"; u.rate=0.8;
      const v=pickVoice(lang?lang.slice(0,2).toLowerCase():"en"); if(v) u.voice=v; synth.speak(u); };
    const voices=synth.getVoices()||[];
    if(voices.length){ setTimeout(fire,40); return; }
    let done=false; const go=()=>{ if(done)return; done=true; fire(); };
    synth.addEventListener("voiceschanged", go, {once:true}); setTimeout(go,600);
  }

    // play the SOUND: real recording if available, else native-language syllable TTS
    const playSound=(p,key)=>{
      if(window.speechSynthesis) window.speechSynthesis.cancel();
      if(p.aud){
        if(!audioRef.current) audioRef.current = new Audio();
        const a=audioRef.current; a.pause(); a.src="audio/"+p.aud+".mp3"; a.currentTime=0;
        a.play().then(()=>{ setPlaying(key); a.onended=()=>setPlaying(null); })
         .catch(()=>{ if(p.say) speak(p.say, lang.speak); });
      } else if(p.say){ speak(p.say, lang.speak); }
      else { speak(p.examples[0], lang.speak); }
    };

      <div style={{maxWidth:800,margin:"0 auto",padding:"24px 20px 60px"}}>

            <button key={l.id} onClick={()=>{setLangId(l.id);setFilter("all");}}
              style={{flex:1,padding:"10px 6px",borderRadius:10,fontSize:13,fontWeight:700,border:langId===l.id?"2.5px solid "+BLACK:"2px solid "+BLACK+"20",background:langId===l.id?l.color:"#fff",color:BLACK,transition:"all 0.2s"}}>
              {l.flag} {l.label}
              <div style={{fontSize:10,fontWeight:500,opacity:0.5,marginTop:2}}>{l.data.length} phonemes</div>
            </button>
          ))}
        </div>

        <div style={{background:lang.color+"30",border:"2px solid "+lang.color,borderRadius:10,padding:"10px 14px",textAlign:"center",fontSize:13,fontWeight:600,color:BLACK,marginBottom:16}}>
          🔊 Tap a <span style={{fontWeight:700}}>/sound/</span> to hear the real recording · tap a <span style={{fontWeight:700}}>word</span> to hear it
        </div>

        <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:18}}>
          {lang.cats.map(c=>(
            <button key={c} onClick={()=>setFilter(c)}
              style={{padding:"5px 14px",borderRadius:999,fontSize:12,fontWeight:700,border:filter===c?"2px solid "+BLACK:"1.5px solid "+BLACK+"25",background:filter===c?BLACK:"#fff",color:filter===c?"#fff":BLACK,transition:"all 0.15s"}}>{c}</button>
          ))}
        </div>

        <div className="phon-grid">
          {phonemes.map((p,i)=>{
            const key=langId+"-"+i;
            return (
            <div key={i} style={{border:"2px solid "+BLACK,borderRadius:10,overflow:"hidden",background:"#fff"}}>
              <div style={{height:5,background:lang.color}} />
              <div style={{padding:"12px 14px"}}>
                <button onClick={()=>playSound(p,key)} title="Hear the sound"
                  style={{background:playing===key?lang.color+"40":"none",border:"none",borderRadius:8,padding:"2px 6px",margin:"-2px -6px 6px",display:"flex",alignItems:"center",gap:6,transition:"background 0.15s"}}>
                  <span style={{fontSize:24,fontWeight:700,color:BLACK}}>/{p.ipa}/</span>
                  <span style={{fontSize:13,opacity:0.45}}>🔊</span>
                </button>
                <div style={{display:"flex",flexWrap:"wrap",gap:4,marginBottom:8}}>
                  {p.spellings.map((s,j)=>(<span key={j} style={{fontSize:11,fontWeight:600,background:lang.color+"30",color:BLACK,borderRadius:4,padding:"2px 7px"}}>{s}</span>))}
                </div>
                <div style={{display:"flex",flexWrap:"wrap",gap:"4px 12px"}}>
                  {p.examples.map((ex,j)=>(
                    <button key={j} onClick={()=>speak(ex, lang.speak)} style={{background:"none",border:"none",padding:0,fontSize:14,fontWeight:600,color:BLACK,textDecoration:"underline",textDecorationColor:lang.color,textUnderlineOffset:3}}>{ex}</button>
                  ))}
                </div>
              </div>
            </div>
          );})}
        </div>

        <div style={{textAlign:"center",marginTop:24,fontSize:12,fontWeight:500,color:BLACK,opacity:0.35}}>{lang.flag} {lang.data.length} phonemes · real IPA recordings · amynguyen.studio</div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
