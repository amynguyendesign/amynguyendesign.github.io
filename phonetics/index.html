  function pickVoice(pref){
    const voices = window.speechSynthesis ? window.speechSynthesis.getVoices()||[] : [];
    const cands = voices.filter(v=>v.lang && v.lang.toLowerCase().replace("_","-").startsWith(pref));
    if(!cands.length) return null;
    return cands.find(v=>v.default)||cands[0];
  }
  function speak(text, lang){
    if(!window.speechSynthesis || !text) return;
    const synth = window.speechSynthesis; synth.cancel();
    const fire=()=>{
      const u=new SpeechSynthesisUtterance(text);
      u.lang=lang||"en-US"; u.rate=0.8;
      const v=pickVoice(lang?lang.slice(0,2).toLowerCase():"en"); if(v) u.voice=v;
      synth.speak(u);
    };
    const voices=synth.getVoices()||[];
    if(voices.length){ setTimeout(fire,50); return; }
    let done=false; const go=()=>{ if(done)return; done=true; fire(); };
    synth.addEventListener("voiceschanged", go, {once:true}); setTimeout(go,600);
  }

              {l.flag} {l.label}
              <div style={{fontSize:10,fontWeight:500,opacity:0.5,marginTop:2}}>{l.data.length} phonemes</div>
            </button>

          🔊 Tap a <span style={{fontWeight:700}}>/sound/</span> to hear the phoneme · tap a <span style={{fontWeight:700}}>word</span> to hear it
        </div>

        <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:18}}>
          {lang.cats.map(c=>(

                <button onClick={()=>speak(p.say, lang.speak)} title="Hear the sound"
                  style={{background:"none",border:"none",padding:0,marginBottom:6,display:"flex",alignItems:"center",gap:6}}>
                  <span style={{fontSize:24,fontWeight:700,color:BLACK}}>/{p.ipa}/</span>
                  <span style={{fontSize:13,opacity:0.4}}>🔊</span>
                </button>
                <div style={{display:"flex",flexWrap:"wrap",gap:4,marginBottom:8}}>
                  {p.spellings.map((s,j)=>(<span key={j} style={{fontSize:11,fontWeight:600,background:lang.color+"30",color:BLACK,borderRadius:4,padding:"2px 7px"}}>{s}</span>))}
                </div>
                <div style={{display:"flex",flexWrap:"wrap",gap:"4px 12px"}}>
                  {p.examples.map((ex,j)=>(
                    <button key={j} onClick={()=>speak(ex, lang.speak)} style={{background:"none",border:"none",padding:0,fontSize:14,fontWeight:600,color:BLACK,textDecoration:"underline",textDecorationColor:lang.color,textUnderlineOffset:3}}>{ex}</button>
                  ))}
                </div>
              </div>
            </div>
          ))}
        </div>

        <div style={{textAlign:"center",marginTop:24,fontSize:12,fontWeight:500,color:BLACK,opacity:0.35}}>{lang.flag} {lang.data.length} phonemes &middot; amynguyen.studio</div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
