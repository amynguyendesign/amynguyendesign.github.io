<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Phonétique — Amy Nguyen</title>
  <meta name="description" content="The 36 sounds of French, anchored to English and Vietnamese words. Tap to listen." />
  <link rel="icon" href="/favicon.ico" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
  <style>
    html,body{margin:0;padding:0;background:#FDFAF6;color:#2A2418;font-family:"Courier New",Courier,monospace;-webkit-font-smoothing:antialiased;}
    *{box-sizing:border-box;}
    button{font-family:inherit;}
    @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;}}
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;
    const MONO = '"Courier New", Courier, monospace';
    const C = { ink:"#2A2418", accent:"#A0785A", dark:"#3A3020", muted:"#8A7A60", paper:"#FDFAF6", card:"#FFFDF9", border:"#E8DEC9", chip:"#F1E7D2", hi:"#B4530E" };

    const PHONEMES = [
    { ipa: 'i', cat: 'voyelle', say: 'i',
      fr: { spellings: ['i','y'], examples: ['île','pie','ami','pyjama'] },
      en: { examples: [{w:'see',hl:'ee'},{w:'machine',hl:'i'},{w:'happy',hl:'y'}] },
      vi: { examples: [{w:'đi',hl:'i'},{w:'phim',hl:'i'},{w:'mít',hl:'í'}] } },
    { ipa: 'a', cat: 'voyelle', say: 'a',
      fr: { spellings: ['a','à','â'], examples: ['arbre','à','Pâques'] },
      en: { examples: [{w:'cat',hl:'a'},{w:'spa',hl:'a'},{w:'father',hl:'a'}] },
      vi: { examples: [{w:'ba',hl:'a'},{w:'cha',hl:'a'},{w:'nhà',hl:'a'}] } },
    { ipa: 'e', cat: 'voyelle', say: 'et',
      fr: { spellings: ['é','er','ez'], examples: ['thé','fermer','nez'] },
      en: { examples: [{w:'day',hl:'ay'},{w:'café',hl:'é'},{w:'they',hl:'ey'}] },
      vi: { examples: [{w:'lê',hl:'ê'},{w:'bê',hl:'ê'},{w:'đêm',hl:'ê'}] } },
    { ipa: 'ɛ', cat: 'voyelle', say: 'est',
      fr: { spellings: ['è','ê','et','ai','ei'], examples: ['mère','tête','lait','neige'] },
      en: { examples: [{w:'bed',hl:'e'},{w:'met',hl:'e'},{w:'fair',hl:'ai'}] },
      vi: { examples: [{w:'em',hl:'e'},{w:'mẹ',hl:'e'},{w:'kẻ',hl:'e'}] } },
    { ipa: 'ə', cat: 'voyelle', say: 'e',
      fr: { spellings: ['e'], examples: ['cheval','me','cheveux'] },
      en: { examples: [{w:'about',hl:'a'},{w:'sofa',hl:'a'},{w:'taken',hl:'e'}] },
      vi: { examples: [{w:'cơ',hl:'ơ'},{w:'tơ',hl:'ơ'},{w:'lơ',hl:'ơ'}] } },
    { ipa: 'ø', cat: 'voyelle', say: 'eu',
      fr: { spellings: ['eu'], examples: ['heureux','joyeux','peu'] },
      en: { examples: [{w:'her',hl:'er'},{w:'fur',hl:'ur'}], note: 'No exact English sound. Say "uh" with tightly rounded lips.' },
      vi: { examples: [{w:'phơ',hl:'ơ'}], note: 'No exact Vietnamese sound. Round your lips on "ơ".' } },
    { ipa: 'œ', cat: 'voyelle', say: 'œu',
      fr: { spellings: ['œu','eu'], examples: ['cœur','sœur','fleur','neuf'] },
      en: { examples: [{w:'fur',hl:'ur'},{w:'her',hl:'er'}], note: 'No exact English sound. Open "uh", lips rounded.' },
      vi: { examples: [{w:'cơ',hl:'ơ'}], note: 'No exact Vietnamese sound. ≈ open "ơ".' } },
    { ipa: 'o', cat: 'voyelle', say: 'au',
      fr: { spellings: ['o','ô','au','eau'], examples: ['vélo','hôpital','jaune','château'] },
      en: { examples: [{w:'boat',hl:'oa'},{w:'go',hl:'o'},{w:'snow',hl:'ow'}] },
      vi: { examples: [{w:'cô',hl:'ô'},{w:'tô',hl:'ô'},{w:'hôm',hl:'ô'}] } },
    { ipa: 'ɔ', cat: 'voyelle', say: 'o',
      fr: { spellings: ['o','au'], examples: ['école','comme','Paul'] },
      en: { examples: [{w:'dog',hl:'o'},{w:'thought',hl:'ou'},{w:'law',hl:'aw'}] },
      vi: { examples: [{w:'co',hl:'o'},{w:'to',hl:'o'},{w:'con',hl:'o'}] } },
    { ipa: 'u', cat: 'voyelle', say: 'ou',
      fr: { spellings: ['ou'], examples: ['vous','loup','souris'] },
      en: { examples: [{w:'food',hl:'oo'},{w:'moon',hl:'oo'},{w:'blue',hl:'ue'}] },
      vi: { examples: [{w:'cu',hl:'u'},{w:'thu',hl:'u'},{w:'mưa',hl:'ư'}] } },
    { ipa: 'y', cat: 'voyelle', say: 'u',
      fr: { spellings: ['u','û'], examples: ['tu','cube','sur','mûre'] },
      en: { examples: [], note: 'No English sound. Say "ee" with tightly rounded lips.' },
      vi: { examples: [], note: 'No Vietnamese sound. Say "i" with rounded lips.' } },
    { ipa: 'ɑ̃', cat: 'nasale', say: 'an',
      fr: { spellings: ['an','am','en','em'], examples: ['maman','dans','cent','temps'] },
      en: { examples: [{w:'aunt',hl:'au'}], note: 'No English nasal vowel. British "aunt", through the nose.' },
      vi: { examples: [{w:'ăng',hl:'ăng'}], note: '≈ "ăng" but nasal, drop the hard g.' } },
    { ipa: 'ɔ̃', cat: 'nasale', say: 'on',
      fr: { spellings: ['on','om'], examples: ['bon','mon','nombre'] },
      en: { examples: [{w:'song',hl:'on'}], note: '≈ "song" but nasal, drop the g.' },
      vi: { examples: [{w:'ông',hl:'ông'}], note: '≈ "ông" but nasal, drop the g.' } },
    { ipa: 'ɛ̃', cat: 'nasale', say: 'in',
      fr: { spellings: ['in','im','ein','ain'], examples: ['vin','pain','plein','main'] },
      en: { examples: [{w:'sang',hl:'an'}], note: '≈ "sang" but nasal, drop the g.' },
      vi: { examples: [{w:'anh',hl:'anh'}], note: '≈ "anh" nasalised.' } },
    { ipa: 'œ̃', cat: 'nasale', say: 'un',
      fr: { spellings: ['un','um'], examples: ['un','brun','parfum'] },
      en: { examples: [{w:'sung',hl:'un'}], note: '≈ "sung" but nasal, drop the g.' },
      vi: { examples: [{w:'âng',hl:'âng'}], note: '≈ nasalised "âng".' } },
    { ipa: 'w', cat: 'semi-voyelle', say: 'oui',
      fr: { spellings: ['oi','oî','ou','w'], examples: ['oui','moi','roi','jouer'] },
      en: { examples: [{w:'we',hl:'w'},{w:'win',hl:'w'},{w:'water',hl:'w'}] },
      vi: { examples: [{w:'hoa',hl:'oa'},{w:'quà',hl:'u'},{w:'toán',hl:'oa'}] } },
    { ipa: 'j', cat: 'semi-voyelle', say: 'ille',
      fr: { spellings: ['y','ill','ail','eil','euil','ouil'], examples: ['crayon','fille','soleil','paille'] },
      en: { examples: [{w:'yes',hl:'y'},{w:'you',hl:'y'},{w:'yellow',hl:'y'}] },
      vi: { examples: [{w:'yêu',hl:'y'},{w:'gia',hl:'gi'},{w:'ya',hl:'y'}] } },
    { ipa: 'ɥ', cat: 'semi-voyelle', say: 'ui',
      fr: { spellings: ['ui'], examples: ['lui','bruit','nuit'] },
      en: { examples: [], note: 'No English sound. Say "w" but with lips set for "ee".' },
      vi: { examples: [{w:'huy',hl:'uy'},{w:'tuy',hl:'uy'}], note: '≈ "uy" in "huy".' } },
    { ipa: 'p', cat: 'consonne', say: 'pé',
      fr: { spellings: ['p','pp'], examples: ['papa','pour','apprendre'] },
      en: { examples: [{w:'pen',hl:'p'},{w:'spy',hl:'p'},{w:'map',hl:'p'}] },
      vi: { examples: [{w:'pin',hl:'p'},{w:'sấp',hl:'p'}] } },
    { ipa: 'b', cat: 'consonne', say: 'be',
      fr: { spellings: ['b'], examples: ['robe','bien','beaucoup'] },
      en: { examples: [{w:'bed',hl:'b'},{w:'baby',hl:'b'}] },
      vi: { examples: [{w:'ba',hl:'b'},{w:'bé',hl:'b'},{w:'bố',hl:'b'}] } },
    { ipa: 't', cat: 'consonne', say: 'te',
      fr: { spellings: ['t','tt'], examples: ['tard','toi','botte'] },
      en: { examples: [{w:'top',hl:'t'},{w:'stop',hl:'t'}] },
      vi: { examples: [{w:'ta',hl:'t'},{w:'tô',hl:'t'},{w:'tay',hl:'t'}] } },
    { ipa: 'd', cat: 'consonne', say: 'de',
      fr: { spellings: ['d','dd'], examples: ['doigt','dans','addition'] },
      en: { examples: [{w:'dog',hl:'d'},{w:'day',hl:'d'}] },
      vi: { examples: [{w:'đi',hl:'đ'},{w:'đỏ',hl:'đ'},{w:'đá',hl:'đ'}] } },
    { ipa: 'k', cat: 'consonne', say: 'que',
      fr: { spellings: ['c','cc','qu','q','k','ch'], examples: ['car','quand','kiwi','chorale'] },
      en: { examples: [{w:'cat',hl:'c'},{w:'kite',hl:'k'},{w:'sky',hl:'k'}] },
      vi: { examples: [{w:'ca',hl:'c'},{w:'kê',hl:'k'},{w:'quà',hl:'qu'}] } },
    { ipa: 'g', cat: 'consonne', say: 'gue',
      fr: { spellings: ['g','gu'], examples: ['gare','grand','bague'] },
      en: { examples: [{w:'go',hl:'g'},{w:'big',hl:'g'}] },
      vi: { examples: [{w:'ga',hl:'g'},{w:'gô',hl:'g'},{w:'gà',hl:'g'}] } },
    { ipa: 'f', cat: 'consonne', say: 'fe',
      fr: { spellings: ['f','ff','ph'], examples: ['fée','coffre','éléphant'] },
      en: { examples: [{w:'fish',hl:'f'},{w:'phone',hl:'ph'}] },
      vi: { examples: [{w:'phở',hl:'ph'},{w:'phim',hl:'ph'},{w:'fan',hl:'f'}] } },
    { ipa: 'v', cat: 'consonne', say: 've',
      fr: { spellings: ['v','w'], examples: ['voiture','livre','wagon'] },
      en: { examples: [{w:'van',hl:'v'},{w:'very',hl:'v'}] },
      vi: { examples: [{w:'và',hl:'v'},{w:'vui',hl:'v'},{w:'vô',hl:'v'}] } },
    { ipa: 's', cat: 'consonne', say: 'se',
      fr: { spellings: ['s','ss','c','ç','sc'], examples: ['savon','citron','leçon','scie'] },
      en: { examples: [{w:'sun',hl:'s'},{w:'city',hl:'c'},{w:'mess',hl:'ss'}] },
      vi: { examples: [{w:'xa',hl:'x'},{w:'xin',hl:'x'},{w:'sữa',hl:'s'}] } },
    { ipa: 'z', cat: 'consonne', say: 'ze',
      fr: { spellings: ['z','s'], examples: ['zèbre','maison','cousin'] },
      en: { examples: [{w:'zoo',hl:'z'},{w:'rose',hl:'s'}] },
      vi: { examples: [{w:'da',hl:'d'},{w:'giá',hl:'gi'}], note: 'Northern Vietnamese "d"/"gi" = z-sound.' } },
    { ipa: 'ʃ', cat: 'consonne', say: 'che',
      fr: { spellings: ['ch','sh'], examples: ['chien','chez','short'] },
      en: { examples: [{w:'ship',hl:'sh'},{w:'sure',hl:'s'},{w:'nation',hl:'ti'}] },
      vi: { examples: [{w:'sông',hl:'s'},{w:'sữa',hl:'s'}], note: '≈ Vietnamese "s" (retroflex sh).' } },
    { ipa: 'ʒ', cat: 'consonne', say: 'je',
      fr: { spellings: ['j','g(e)','g(i)'], examples: ['jour','pigeon','girafe'] },
      en: { examples: [{w:'measure',hl:'s'},{w:'vision',hl:'s'},{w:'beige',hl:'g'}] },
      vi: { examples: [{w:'gì',hl:'gi'}], note: 'No exact match. ≈ soft buzzed "gi".' } },
    { ipa: 'l', cat: 'consonne', say: 'le',
      fr: { spellings: ['l','ll'], examples: ['lapin','lune','ballon'] },
      en: { examples: [{w:'love',hl:'l'},{w:'light',hl:'l'}] },
      vi: { examples: [{w:'la',hl:'l'},{w:'lê',hl:'l'},{w:'lá',hl:'l'}] } },
    { ipa: 'ʁ', cat: 'consonne', say: 're',
      fr: { spellings: ['r','rr'], examples: ['rose','mer','arrière','beurre'] },
      en: { examples: [], note: 'No English sound. Soft gargle at the back of the throat (not rolled).' },
      vi: { examples: [], note: 'No Vietnamese sound. Guttural French R, not the Vietnamese r.' } },
    { ipa: 'm', cat: 'consonne', say: 'me',
      fr: { spellings: ['m','mm'], examples: ['chemin','même','pomme'] },
      en: { examples: [{w:'man',hl:'m'},{w:'mom',hl:'m'}] },
      vi: { examples: [{w:'má',hl:'m'},{w:'mẹ',hl:'m'},{w:'mưa',hl:'m'}] } },
    { ipa: 'n', cat: 'consonne', say: 'ne',
      fr: { spellings: ['n','nn'], examples: ['banane','non','année'] },
      en: { examples: [{w:'no',hl:'n'},{w:'sun',hl:'n'}] },
      vi: { examples: [{w:'nó',hl:'n'},{w:'na',hl:'n'},{w:'năm',hl:'n'}] } },
    { ipa: 'ɲ', cat: 'consonne', say: 'gne',
      fr: { spellings: ['gn','ni'], examples: ['montagne','champignon','panier'] },
      en: { examples: [{w:'canyon',hl:'ny'},{w:'onion',hl:'ni'}] },
      vi: { examples: [{w:'nhà',hl:'nh'},{w:'nhỏ',hl:'nh'},{w:'nhanh',hl:'nh'}], note: 'Vietnamese "nh" = exact match!' } },
    { ipa: 'ŋ', cat: 'consonne', say: 'ngue',
      fr: { spellings: ['ing'], examples: ['parking','camping'] },
      en: { examples: [{w:'sing',hl:'ng'},{w:'song',hl:'ng'},{w:'king',hl:'ng'}] },
      vi: { examples: [{w:'ngà',hl:'ng'},{w:'công',hl:'ng'},{w:'ngon',hl:'ng'}], note: 'Vietnamese "ng" = exact match!' } },
  ];

    const TABS = [['fr','🇫🇷 Français'], ['en','🇬🇧 English'], ['vi','🇻🇳 Tiếng Việt']];

    const STRINGS = {
    fr: {
      title: "Phonétique — Les 36 sons",
      sub: "Chaque onglet relie le son français à un mot de cette langue.",
      banner: "🔊 Touche un /son/ pour le phonème · touche un mot pour l'écouter",
      footer: "36 sons · repères français / anglais / vietnamien",
    },
    en: {
      title: "Phonetics — The 36 sounds",
      sub: "Each tab anchors the French sound to a word in that language.",
      banner: "🔊 Tap a /sound/ for the French phoneme · tap a word to hear it",
      footer: "36 sounds · French / English / Vietnamese anchors",
    },
    vi: {
      title: "Ngữ âm — 36 âm tiếng Pháp",
      sub: "Mỗi tab gắn âm tiếng Pháp với một từ trong ngôn ngữ đó.",
      banner: "🔊 Chạm vào /âm/ để nghe âm tiếng Pháp · chạm vào từ để nghe",
      footer: "36 âm · ví dụ tiếng Pháp / Anh / Việt",
    },
  };

    function phonSpeak(text, lang){
      if(!window.speechSynthesis || !text) return;
      const synth = window.speechSynthesis;
      synth.cancel();
      setTimeout(()=>{
        const u = new SpeechSynthesisUtterance(text);
        u.lang = lang || 'fr-FR';
        const pref = (lang||'fr').slice(0,2).toLowerCase();
        const voices = synth.getVoices() || [];
        const v = voices.find(x=>x.lang && x.lang.toLowerCase().startsWith(pref));
        if(v) u.voice = v;
        u.rate = 0.85;
        synth.speak(u);
      }, 60);
    }

    function hi(text, start, len){
      return (<span>{text.slice(0,start)}<span style={{color:C.hi,fontWeight:700,textDecoration:"underline",textUnderlineOffset:"2px"}}>{text.slice(start,start+len)}</span>{text.slice(start+len)}</span>);
    }
    function hlAuto(word, spellings){
      const lw = word.toLowerCase();
      const sorted = [...spellings].sort((a,b)=>b.length-a.length);
      for(const sp of sorted){
        const clean = sp.toLowerCase().replace(/[()]/g,'');
        const k = lw.indexOf(clean);
        if(k>=0) return hi(word,k,clean.length);
      }
      return <span>{word}</span>;
    }
    function hlSub(word, hl){
      if(!hl) return <span>{word}</span>;
      const k = word.toLowerCase().indexOf(hl.toLowerCase());
      if(k<0) return <span>{word}</span>;
      return hi(word,k,hl.length);
    }

    function App(){
      const [tab,setTab] = useState('fr');
      const [filter,setFilter] = useState('Toutes');
      const t = STRINGS[tab];
      const cats = ['Toutes','voyelle','nasale','semi-voyelle','consonne'];
      const list = filter==='Toutes' ? PHONEMES : PHONEMES.filter(p=>p.cat===filter);
      const wordLang = tab==='en' ? 'en-US' : tab==='vi' ? 'vi-VN' : 'fr-FR';

      const renderExamples = (p) => {
        if(tab==='fr'){
          return p.fr.examples.map((ex,j)=>(
            <button key={j} onClick={()=>phonSpeak(ex,'fr-FR')} style={btnWord}>{hlAuto(ex,p.fr.spellings)}</button>
          ));
        }
        const d = tab==='en' ? p.en : p.vi;
        return (<>
          {d.examples.map((e,j)=>(
            <button key={j} onClick={()=>phonSpeak(e.w,wordLang)} style={btnWord}>{hlSub(e.w,e.hl)}</button>
          ))}
          {d.note && <span style={{width:"100%",fontSize:"11px",fontStyle:"italic",color:C.muted,marginTop:2}}>{d.note}</span>}
        </>);
      };

      const btnWord = {fontFamily:MONO,fontSize:"14px",color:C.ink,background:"none",border:"none",padding:0,cursor:"pointer"};

      return (
        <div style={{maxWidth:780,margin:"0 auto",padding:"20px 16px 60px"}}>
          <a href="../" style={{display:"inline-block",color:C.muted,textDecoration:"none",fontSize:"13px",marginBottom:14}}
             onMouseEnter={e=>e.currentTarget.style.color=C.accent}
             onMouseLeave={e=>e.currentTarget.style.color=C.muted}>&larr; back to amynguyen.studio</a>

          <h1 style={{fontSize:"1.9rem",fontWeight:700,color:C.dark,margin:"0 0 2px"}}>{t.title.split("—")[0].trim()}<span style={{color:C.accent}}>.</span></h1>
          <p style={{fontSize:"0.9rem",color:C.muted,margin:"0 0 16px"}}>{t.sub}</p>

          {/* Language tabs */}
          <div style={{display:"flex",gap:8,marginBottom:12}}>
            {TABS.map(([k,label])=>(
              <button key={k} onClick={()=>setTab(k)} style={{
                flex:1,padding:"9px 6px",borderRadius:10,fontSize:"13px",fontWeight:700,cursor:"pointer",
                fontFamily:MONO,transition:"all .15s",
                border:"1.5px solid "+(tab===k?C.accent:C.border),
                background:tab===k?C.accent:C.card,
                color:tab===k?C.paper:C.dark}}>{label}</button>
            ))}
          </div>

          {/* Audible banner */}
          <div style={{background:C.chip,border:"1px solid "+C.border,borderRadius:10,padding:"8px 12px",textAlign:"center",fontSize:"13px",color:C.dark,marginBottom:14}}>{t.banner}</div>

          {/* Category filter */}
          <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:18}}>
            {cats.map(c=>(
              <button key={c} onClick={()=>setFilter(c)} style={{
                padding:"5px 12px",borderRadius:999,fontSize:"12px",fontWeight:700,cursor:"pointer",fontFamily:MONO,transition:"all .15s",
                border:"1px solid "+(filter===c?C.dark:C.border),
                background:filter===c?C.dark:C.card,
                color:filter===c?C.paper:C.muted}}>{c}</button>
            ))}
          </div>

          {/* Cards */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(178px,1fr))",gap:10}}>
            {list.map((p,i)=>(
              <div key={i} style={{border:"1px solid "+C.border,borderRadius:12,padding:12,background:C.card}}>
                <button onClick={()=>phonSpeak(p.say,'fr-FR')} style={{background:"none",border:"none",padding:0,cursor:"pointer",marginBottom:6,display:"block"}}>
                  <span style={{fontSize:"22px",fontWeight:700,color:C.accent,fontFamily:MONO}}>/{p.ipa}/</span>
                </button>
                <div style={{display:"flex",flexWrap:"wrap",gap:4,marginBottom:6}}>
                  {p.fr.spellings.map((s,j)=>(
                    <span key={j} style={{fontSize:"10px",background:C.chip,color:C.dark,borderRadius:4,padding:"2px 6px",fontFamily:MONO}}>{s}</span>
                  ))}
                </div>
                <div style={{display:"flex",flexWrap:"wrap",gap:"2px 12px",alignItems:"baseline"}}>
                  {renderExamples(p)}
                </div>
              </div>
            ))}
          </div>

          <p style={{textAlign:"center",fontSize:"12px",color:C.muted,marginTop:22}}>{t.footer}</p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
