  function speak(t,lang){if(!window.speechSynthesis||!t)return;const sy=window.speechSynthesis;sy.cancel();const f=()=>{const u=new SpeechSynthesisUtterance(t);u.lang=lang;u.rate=0.8;const vs=sy.getVoices()||[];const c=vs.filter(v=>v.lang&&v.lang.toLowerCase().replace("_","-").startsWith(lang.slice(0,2)));if(c.length)u.voice=c.find(v=>v.default)||c[0];sy.speak(u);};const vs=sy.getVoices()||[];if(vs.length){setTimeout(f,40);return;}let d=false;const g=()=>{if(d)return;d=true;f();};sy.addEventListener("voiceschanged",g,{once:true});setTimeout(g,600);}

  function hl(word,sps){
    const lw=word.toLowerCase();
    const sorted=[...sps].sort((a,b)=>b.length-a.length);
    for(const s of sorted){const c=s.toLowerCase().replace(/[()]/g,"");const k=lw.indexOf(c);if(k>=0)return{b:word.slice(0,k),m:word.slice(k,k+c.length),a:word.slice(k+c.length)};}
    return{b:word,m:"",a:""};
  }

              <div style={{fontSize:10,fontWeight:500,opacity:0.5,marginTop:2}}>{l.data.length} phonemes</div>

          ))}
        </div>

          {L.cats.map(c=>(

          ))}
        </div>

        <div className="pg">

              <div style={{padding:"12px 14px"}}>
